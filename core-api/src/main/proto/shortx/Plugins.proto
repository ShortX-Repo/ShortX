syntax = "proto3";

option java_package = "tornaco.apps.shortx.core.proto.plugins";
option java_outer_classname = "OuterPlugins";
option java_multiple_files = true;

import "google/protobuf/any.proto";
import "shortx/Common.proto";

message ShortXPlugin {
  string pkgName = 1;
  string pluginName = 2;
  string pluginDescription = 3;
  bool isEnabled = 4;
}

message ShortXPluginAction {
  ShortXPlugin plugin = 1;
  string actionLabel = 2;
  string actionDescription = 3;
  AndroidIntent pickerIntent = 4;
  string evaluator = 5;
}