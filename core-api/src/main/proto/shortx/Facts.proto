enum MethodHookLifecycle {
  InitZygote = 0;
  LoadedPackage = 2;
}

message MethodHookExpressions {
  string expressionMVEL = 1;
  string contextKey = 2;
}

message MethodHookConstraintParamsCount {
  int32 count = 1;
}

message MethodHookConstraintParamsType {
  repeated string type = 1;
}

message MethodHookConstraintReturnType {
  string type = 1;
}

message ValueConstraints {
  GlobalVarOp op = 1;
  GlobalVarOpPayload payload = 2;
}

enum SensorValueTrend {
  SensorValueTrend_Any = 0;
  SensorValueTrend_Increase = 1;
  SensorValueTrend_Decrease = 2;
}

enum SunRise {
  SunRise_Rise = 0;
  SunRise_Set = 1;
}