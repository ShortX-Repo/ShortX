enum EdgeGestureStepType {
  SwipeLeft = 0;
  SwipeRight = 1;
  SwipeUp = 2;
  SwipeDown = 3;
  Hover = 4;
  SingleTapStep = 5;
  DoubleTapStep = 6;
  LongTapStep = 7;
}

message EdgeGestureStep {
  EdgeGestureStepType type = 1;
}

message EdgeGesture {
  Edge edge = 1;
  // Legacy one-step gesture field. Keep for backward compatibility.
  Gesture gesture = 2;
  bool isIntercept = 3;
  repeated AppPkg apps = 4;
  repeated string pkgSets = 5;
  
  // 添加自定义矩形区域，当设置时将覆盖默认的edge区域计算
  Rect customRect = 6;
  int32 downX = 7;
  int32 downY = 8;

  // For matcher.
  bool isTriggerCustom = 9;
  optional bool enableGestureHint = 10;
  repeated EdgeGestureStep childSteps = 11;
  optional bool enableGestureHaptic = 12;
  optional bool useAbsoluteArea = 13;

  string tag = 97;
  CustomContextDataKey customContextDataKey = 98;
  string note = 99;
  string id = 100;
  bool isDisabled = 101;
}

message CornerSwipeToCenter {
  ScreenCorner corner = 1;
  int32 downX = 2;
  int32 downY = 3;
  bool enableGestureHint = 4;
  optional bool isIntercept = 5;
  bool enableGestureHaptic = 6;

  string tag = 97;
  CustomContextDataKey customContextDataKey = 98;
  string note = 99;
  string id = 100;
  bool isDisabled = 101;
}

message ScreenGesture {
  Gesture gesture = 1;
  repeated AppPkg constraintFrontApps = 2;

  string tag = 97;
  CustomContextDataKey customContextDataKey = 98;
  string note = 99;
  string id = 100;
  bool isDisabled = 101;
}

enum Edge {
  LeftTop = 0;
  LeftCenter = 1;
  LeftBottom = 2;
  LeftAll = 3;

  RightTop = 4;
  RightCenter = 5;
  RightBottom = 6;
  RightAll = 7;

  TopLeft = 8;
  TopCenter = 9;
  TopRight = 10;
  TopAll = 11;

  BottomLeft = 12;
  BottomCenter = 13;
  BottomRight = 14;
  BottomAll = 15;
}

enum ScreenCorner {
  CornerTopLeft = 0;
  CornerTopRight = 1;
  CornerBottomLeft = 2;
  CornerBottomRight = 3;
}

enum Gesture {
  DoubleTap = 0;
  LongTap = 1;
  SingleTap = 2;
  SwipeFromBottom = 3;
  SwipeFromRight = 4;
  SwipeFromLeft = 5;
  SwipeFromTop = 6;
}

enum WeekDay {
  MONDAY = 0; TUESDAY = 1; WEDNESDAY = 2; THURSDAY = 3; FRIDAY = 4; SATURDAY = 5; SUNDAY = 6;
}

message RepeatDays {
  repeated WeekDay days = 1;
}

message WorkdayFilter {
