name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - uses: nttld/setup-ndk@v1
      with:
        ndk-version: r29
        local-cache: true
    
    - uses: lukka/get-cmake@latest  
      with:
        useLocalCache: true
        useCloudCache: false
        cmakeVersion: 3.16.3
    
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Generate CI keystore
      run: |
        chmod +x .github/scripts/generate-ci-keystore.sh
        .github/scripts/generate-ci-keystore.sh
    - name: Build with Gradle
      env:
        GPR_USER: ${{ secrets.GPR_USER }}
        GPR_API_KEY: ${{ secrets.GPR_API_KEY }}
      run: ./gradlew app:assemblePrcRelease
