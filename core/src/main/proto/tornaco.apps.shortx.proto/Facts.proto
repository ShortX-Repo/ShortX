syntax = "proto3";

option java_package = "tornaco.apps.shortx.core.proto.fact";
option java_outer_classname = "OuterFacts";
option java_multiple_files = true;

message KeyEvent {
  int32 keyCode = 1;
}

message ScreenOn {}
message ScreenOff {}
message UserPresent {}

message BatteryLevelChange {
  int32 level = 2;
}
message ChargerPlug {
  bool requireAC = 1;
  bool requireUSB = 2;
}
message ChargerUnplug {
  bool requireAC = 1;
  bool requireUSB = 2;
}
message BatteryLow {}
message BatteryNotLow {}
message BatteryFull {}

message WifiConnected {
  string requiredSSID = 1;
}
message WifiDisconnectedConnected {
  string requiredDisconnectedFromSSID = 1;
}

message EdgeGesture {
  Edge edge = 1;
  Gesture gesture = 2;
}

enum Edge {
  LeftTop = 0;
  LeftCenter = 1;
  LeftBottom = 2;
  LeftAll = 3;

  RightTop = 4;
  RightCenter = 5;
  RightBottom = 6;
  RightAll = 7;

  TopLeft = 8;
  TopCenter = 9;
  TopRight = 10;
  TopAll = 11;

  BottomLeft = 12;
  BottomCenter = 13;
  BottomRight = 14;
  BottomAll = 15;
}

enum Gesture {
  DoubleTap = 0;
  LongTap = 1;
  SingleTap = 2;
  SwipeFromBottom = 3;
  SwipeFromRight = 4;
  SwipeFromLeft = 5;
}

message TimeOfADay {
  int32 hour = 1;
  int32 minutes = 2;
  int32 seconds = 3;
}

enum WeekDay {
  MONDAY = 0; TUESDAY = 1; WEDNESDAY = 2; THURSDAY = 3; FRIDAY = 4; SATURDAY = 5; SUNDAY = 6;
}

message RepeatDays {
  repeated WeekDay days = 1;
}

message Alarm {
  // For fact matcher.
  string tag = 1;
  TimeOfADay triggerAt = 2;
  RepeatDays repeat = 3;
}