syntax = "proto3";

option java_package = "tornaco.apps.shortx.core.proto";
option java_outer_classname = "OuterActions";
option java_multiple_files = true;


import "google/protobuf/any.proto";

message ActionSettings {
  map<string, ActionSetting> data = 1;
}

message ActionSetting {
  string actionName = 1;
  repeated google.protobuf.Any payload = 2;
}

message NoAction {}
message TakeScreenshot {}
message ExpandNotification {}

message StartActivity {
  string componentNameAsString = 1;
}

message ShellCommand {
  string command = 1;
}