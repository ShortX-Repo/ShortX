syntax = "proto3";

option java_package = "tornaco.apps.shortx.core.proto.action";
option java_outer_classname = "OuterActions";
option java_multiple_files = true;

import "google/protobuf/any.proto";
import "shortx/Common.proto";
import "shortx/Conditions.proto";
import "shortx/GlobalVars.proto";

message NoAction {

  string note = 99;
  string id = 100;
}
message TakeScreenshot {

  string note = 99;
  string id = 100;
}
message ExpandNotification {

  string note = 99;
  string id = 100;
}

message StartActivity {
  string componentNameAsString = 1;

  string note = 99;
  string id = 100;
}

message StartActivityIntent {
  AndroidIntent intent = 1;
  int32 userId = 2;

  string note = 99;
  string id = 100;
}

message ShellCommand {
  string command = 1;

  string note = 99;
  string id = 100;
}

message InputText {
  string text = 1;

  string note = 99;
  string id = 100;
}

message ShowToast {
  string message = 1;

  string note = 99;
  string id = 100;
}

message Delay {
  int64 time = 1;

  string note = 99;
  string id = 100;
}

message ExecuteMVEL {
  string expression = 1;

  string note = 99;
  string id = 100;
}

message RemoteExecuteMVEL {
  string title = 1;
  string description = 2;
  string icon = 3;
  string expression = 4;

  string note = 99;
  string id = 100;
}

message OverlayButtonSetting {
  repeated google.protobuf.Any actions = 1;
  string icon = 2;
  int32 index = 3;
  string label = 4;

  string note = 99;
  string id = 100;
}

message HideOverlayButton {

  string note = 99;
  string id = 100;

  repeated string overlayTags = 1;
}

message ShowOverlayButton {
  repeated OverlayButtonSetting buttonSettings = 1;
  bool autoCollapse = 2;
  string tag = 3;


  string note = 99;
  string id = 100;
}

message LaunchApp {
  AppPkg appPkg = 1;

  string note = 99;
  string id = 100;
}

message StopApp {
  repeated AppPkg appPkg = 1;
  repeated string pkgSets = 2;

  string note = 99;
  string id = 100;
}

message SetAppEnabled {
  repeated AppPkg appPkg = 1;
  repeated string pkgSets = 2;
  bool enable = 3;

  string note = 99;
  string id = 100;
}

message SetAppSuspend {
  repeated AppPkg appPkg = 1;
  repeated string pkgSets = 2;
  bool suspend = 3;

  string note = 99;
  string id = 100;
}

message StartAppProcess {
  repeated AppPkg appPkg = 1;
  repeated string pkgSets = 2;

  string note = 99;
  string id = 100;
}

message SetWifiEnabled {
  bool enable = 1;

  string note = 99;
  string id = 100;
}

message SetBTEnabled {
  bool enable = 1;

  string note = 99;
  string id = 100;
}

message SetHotSpotEnabled {
  bool enable = 1;

  string note = 99;
  string id = 100;
}

message SetGPSEnabled {
  bool enable = 1;

  string note = 99;
  string id = 100;
}

message SetDataEnabled {
  bool enable = 1;
  bool hasSpecificSlotId = 2;
  int32 slotId = 3;

  string note = 99;
  string id = 100;
}

message SetNFCEnabled {
  bool enable = 1;

  string note = 99;
  string id = 100;
}

message SetDNDEnabled {
  bool enable = 1;

  string note = 99;
  string id = 100;
}

message SetDarkModeEnabled {
  bool enable = 1;

  string note = 99;
  string id = 100;
}

message SetFlashLightEnabled {
  bool enable = 1;

  string note = 99;
  string id = 100;
}

message SetLocationEnabled {
  bool enable = 1;

  string note = 99;
  string id = 100;
}

message BreakActionExecute {

  string note = 99;
  string id = 100;
}

enum DialogAction {
  Positive = 0;
  Negative = 1;
  Neutral = 2;
  None = 3;
}

message ShowAlertDialog {
  string positive = 1;
  repeated google.protobuf.Any onPositive = 2;

  string negative = 3;
  repeated google.protobuf.Any onNegative = 4;

  string neutral = 5;
  repeated google.protobuf.Any onNeutral = 6;

  string title = 7;
  string message = 8;
  bool cancelable = 9;

  string note = 99;
  string id = 100;
}

message ShowDanmu {
  string text = 1;
  string icon = 2;

  string note = 99;
  string id = 100;
}

message WhileLoop {
  repeated google.protobuf.Any conditions = 1;
  repeated google.protobuf.Any actions = 2;
  ConditionOperator condOp = 3;
  ConditionOperatorPayload condOpPayload = 4;

  int32 delay = 5;
  int32 repeatTimes = 6;

  string note = 99;
  string id = 100;
}

message WriteGlobalVar {
  string varName = 1;
  string valueAsString = 2;


  string note = 99;
  string id = 100;
}

message CreateGlobalVar {
  GlobalVar globalVar = 1;

  string note = 99;
  string id = 100;
}

message DeleteGlobalVar {
  string varName = 1;

  string note = 99;
  string id = 100;
}

// For list
message AddToGlobalVar {
  string varName = 1;
  string valueAsString = 2;


  string note = 99;
  string id = 100;
}

message MapNav {
  Location loc = 1;
  string poi = 2;
  MapApp app = 3;


  string note = 99;
  string id = 100;
}

enum MapApp {
  Baidu = 0;
  Gaode = 1;
}

message Location {
  string latitude = 1;
  string longitude = 2;
}

message PostNotification {
  string tag = 1;
  string  title = 2;
  string message = 3;
  bool isImportant = 4;

  string largeIcon = 5;
  string smallIcon = 6;

  bool vibrate = 7;
  bool sound = 8;

  AppPkg pkgToLaunchOnClick = 9;


  string note = 99;
  string id = 100;
}

message FromDA {
  string daId = 1;


  string note = 99;
  string id = 100;
}

message FindAndClickViewByText {
  string text = 1;
  bool isRegex = 2;
  int64 timeout = 3;


  string note = 99;
  string id = 100;
}

message WaitForIdle {

  string note = 99;
  string id = 100;
}

message IfThenElse {
  repeated google.protobuf.Any _if = 1;
  ConditionOperator _ifCondOp = 2;
  ConditionOperatorPayload _ifCondOpPayload = 3;

  repeated google.protobuf.Any _ifActions = 4;
  repeated google.protobuf.Any _elseActions = 5;


  string note = 99;
  string id = 100;
}