syntax = "proto3";

option java_package = "tornaco.apps.shortx.core.proto.common";
option java_outer_classname = "OuterCommon";
option java_multiple_files = true;

message AppPkg {
  string pkgName = 1;
  int32 userId = 2;
}

enum AppCategory {
  User = 0;
  System = 1;
}

message App {
  AppPkg pkg = 1;
  string label = 2;
  AppCategory category = 3;
  int32 uid = 4;
}

message AppComponent {
  AppPkg pkg = 1;
  string className = 2;
}

message AppComponentInfo {
  AppComponent component = 1;
  string label = 2;
  int32 enableSetting = 3;
}

message Author {
  string name = 1;
}

enum OnOffAny {
  On = 0;
  Off = 1;
  Any = 2;
}

message CommonApiRes {
  int32 result = 1;
  string msg = 2;
  string k = 3;
}

message AndroidIntent {
  string action = 1;
  int32 flags = 2;
  string pkgName = 3;
  string className = 4;
  string data = 5;
  repeated AndroidIntentExtra extras = 6;
}

message AndroidIntentExtra {
  string key = 1;
  string value = 2;
  AndroidIntentExtraType type = 3;
}

enum AndroidIntentExtraType {
  Int = 0;
  Long = 1;
  String = 2;
  Bool = 3;
  Float = 4;
  Double = 5;
}

message Location {
  string latitude = 1;
  string longitude = 2;
}

message UserInfo {
  string name = 1;
  int32 userId = 2;
  bool isMain = 3;
}

message RecentTask {
  AppPkg owner = 1;
  int32 taskId = 2;
}

enum IntOp {
  // >
  IntGreaterThan = 0;
  // >=
  IntGreaterThanOrEQ = 1;
  // <
  IntLessThan = 2;
  // <=
  IntLessThanOrEQ = 3;
  // ==
  IntEqualTo = 4;
}

message ProcessRecord {
  AppPkg owner = 1;
  int64 pid = 2;
  int32 uid = 3;
  string processName = 4;
}