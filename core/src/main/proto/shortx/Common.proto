syntax = "proto3";

option java_package = "tornaco.apps.shortx.core.proto.common";
option java_outer_classname = "OuterCommon";
option java_multiple_files = true;

message AppPkg {
  string pkgName = 1;
  int32 userId = 2;
}

enum AppCategory {
  User = 0;
  System = 1;
}

message App {
  AppPkg pkg = 1;
  string label = 2;
  AppCategory category = 3;
  int32 uid = 4;

  bool isGame = 5;
  bool isXposedMod = 6;
}

message AppComponent {
  AppPkg pkg = 1;
  string className = 2;
}

message AppComponentInfo {
  AppComponent component = 1;
  string label = 2;
  int32 enableSetting = 3;
}

message AppProcessName {
  AppPkg pkg = 1;
  string processName = 2;
}

message ProcessName {
  int32 userId = 1;
  string processName = 2;
}

message Author {
  string name = 1;
}

enum OnOffAny {
  On = 0;
  Off = 1;
  Any = 2;
}

message CommonApiRes {
  int32 result = 1;
  string msg = 2;
  string k = 3;
}

message AndroidIntent {
  string action = 1;
  int32 flags = 2;
  string pkgName = 3;
  string className = 4;
  string data = 5;
  repeated AndroidIntentExtra extras = 6;
}

message AndroidIntentExtra {
  string key = 1;
  string value = 2;
  AndroidIntentExtraType type = 3;
}

enum AndroidIntentExtraType {
  Int = 0;
  Long = 1;
  String = 2;
  Bool = 3;
  Float = 4;
  Double = 5;
}

message Location {
  string latitude = 1;
  string longitude = 2;
}

message UserInfo {
  string name = 1;
  int32 userId = 2;
  bool isMain = 3;
}

message RecentTask {
  AppPkg owner = 1;
  int32 taskId = 2;
}

enum IntOp {
  // >
  IntGreaterThan = 0;
  // >=
  IntGreaterThanOrEQ = 1;
  // <
  IntLessThan = 2;
  // <=
  IntLessThanOrEQ = 3;
  // ==
  IntEqualTo = 4;
}

message ProcessRecord {
  AppPkg owner = 1;
  int64 pid = 2;
  int32 uid = 3;
  string processName = 4;
}

message ShellRes {
  repeated string out = 1;
  repeated string err = 2;
  int32 code = 3;
}

message FloatRange {
  float from = 1;
  float to = 2;
}

message IntRange {
  int32 from = 1;
  int32 to = 2;
}

message TimeOfADay {
  int32 hour = 1;
  int32 minutes = 2;
  int32 seconds = 3;
}

message TimeOfADayRange {
  TimeOfADay start = 1;
  TimeOfADay end = 2;
}

enum VolumeDirection {
  // public static final int ADJUST_RAISE = 1;
  //    public static final int ADJUST_LOWER = -1;
  //    public static final int ADJUST_SAME = 0;
  //    public static final int ADJUST_MUTE = -100;
  //    public static final int ADJUST_UNMUTE = 100;
  //    public static final int ADJUST_TOGGLE_MUTE = 101;

  ADJUST_SAME = 0;
  ADJUST_RAISE = 1;
  ADJUST_LOWER = -1;
  ADJUST_MUTE = -100;
  ADJUST_UNMUTE = 100;
  ADJUST_TOGGLE_MUTE = 101;
}