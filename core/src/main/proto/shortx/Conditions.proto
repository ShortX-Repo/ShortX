syntax = "proto3";

option java_package = "tornaco.apps.shortx.core.proto.condition";
option java_outer_classname = "OuterConditions";
option java_multiple_files = true;

import "shortx/Common.proto";

message True {}
message False {}

message CurrentPkg {
  AppPkg pkg = 1;
}

message CurrentPkgMultiple {
  repeated CurrentPkg pkgs = 1;
}

message CurrentActivity {
  string pkgName = 1;
  string className = 2;
  int32 userId = 3;
}

message MatchMVEL {
  string expression = 1;
}