syntax = "proto3";

option java_package = "tornaco.apps.shortx.core.proto.condition";
option java_outer_classname = "OuterConditions";
option java_multiple_files = true;

import "shortx/Common.proto";

enum ConditionOperator {
  ALL = 0;
  ANY = 1;
  NONE = 2;
  MVEL = 3;
}

message ConditionOperatorPayload {
  string expression = 1;
}

message True {
  bool isInvert = 98;
  string note = 99;
  string id = 100;
}

message False {
  bool isInvert = 98;
  string note = 99;
  string id = 100;
}

message CurrentPkgList {
  repeated AppPkg pkgs = 1;
  repeated string pkgSets = 2;

  bool isInvert = 98;
  string note = 99;
  string id = 100;
}

message CurrentActivity {
  string pkgName = 1;
  string className = 2;
  int32 userId = 3;

  bool isInvert = 98;
  string note = 99;
  string id = 100;
}

message MatchMVEL {
  string expression = 1;

  bool isInvert = 98;
  string note = 99;
  string id = 100;
}

message BatteryPercent {
  int32 value = 1;
  IntOp op = 2;

  bool isInvert = 98;
  string note = 99;
  string id = 100;
}

message AppIsRunning {
  repeated AppPkg pkgs = 1;
  repeated string pkgSets = 2;

  bool isInvert = 98;
  string note = 99;
  string id = 100;
}

message AppIsNotRunning {
  repeated AppPkg pkgs = 1;
  repeated string pkgSets = 2;

  bool isInvert = 98;
  string note = 99;
  string id = 100;
}


message AppHasAudioFocus {
  repeated AppPkg pkgs = 1;
  repeated string pkgSets = 2;

  bool isInvert = 98;
  string note = 99;
  string id = 100;
}


message EvaluateGlobalVar {
  GlobalVarOp op = 1;
  string varName = 2;
  GlobalVarOpPayload payload = 3;

  bool isInvert = 98;
  string note = 99;
  string id = 100;
}

enum GlobalVarOp {
  GreaterThan = 0;
  GreaterThanOrEQ = 1;
  LessThan = 2;
  LessThanOrEQ = 3;
  EqualTo = 4;
  Contains = 5;
  DoesNotContain = 6;
  NotSet = 7;
  HasBeenSet = 8;
  IsEmpty = 9;
  IsNotEmpty = 10;
}

message GlobalVarOpPayload {
  string value = 1;
}

message ServiceIsRunning {
  repeated AppComponent services = 1;
  repeated string globalVarNames = 2;

  bool isInvert = 98;
  string note = 99;
  string id = 100;
}

message ProcessIsRunning {
  repeated ProcessName processList = 1;

  bool isInvert = 98;
  string note = 99;
  string id = 100;
}

message ScreenIsOn {
  bool isInvert = 98;
  string note = 99;
  string id = 100;
}

message VPNIsConnected {
  bool isInvert = 98;
  string note = 99;
  string id = 100;
}