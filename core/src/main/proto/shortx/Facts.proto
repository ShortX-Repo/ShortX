syntax = "proto3";

option java_package = "tornaco.apps.shortx.core.proto.fact";
option java_outer_classname = "OuterFacts";
option java_multiple_files = true;

import "shortx/Common.proto";
import "google/protobuf/any.proto";

message KeyEvent {
  int32 keyCode = 1;

  string note = 99;
  string id = 100;
}

message AdvancedKeyEvent {
  int32 keyCode = 1;
  KeyGesture gesture = 2;
  bool isInterceptMode = 3;

  string note = 99;
  string id = 100;
}

message ScreenOn {
  string note = 99;
  string id = 100;
}

message ScreenOff {
  string note = 99;
  string id = 100;
}

message UserPresent {
  string note = 99;
  string id = 100;
}

message BatteryLevelChanged {
  // 0 means any
  int32 level = 1;

  string note = 99;
  string id = 100;
}

message BatteryTemperatureChanged {
  // 0 means any
  float temp = 1;

  string note = 99;
  string id = 100;
}


message ChargerPlug {
  string note = 99;
  string id = 100;
}

message ChargerUnplug {
  string note = 99;
  string id = 100;
}

message EdgeGesture {
  Edge edge = 1;
  Gesture gesture = 2;

  string note = 99;
  string id = 100;
}

enum Edge {
  LeftTop = 0;
  LeftCenter = 1;
  LeftBottom = 2;
  LeftAll = 3;

  RightTop = 4;
  RightCenter = 5;
  RightBottom = 6;
  RightAll = 7;

  TopLeft = 8;
  TopCenter = 9;
  TopRight = 10;
  TopAll = 11;

  BottomLeft = 12;
  BottomCenter = 13;
  BottomRight = 14;
  BottomAll = 15;
}

enum Gesture {
  DoubleTap = 0;
  LongTap = 1;
  SingleTap = 2;
  SwipeFromBottom = 3;
  SwipeFromRight = 4;
  SwipeFromLeft = 5;
  SwipeFromTop = 6;
}

enum WeekDay {
  MONDAY = 0; TUESDAY = 1; WEDNESDAY = 2; THURSDAY = 3; FRIDAY = 4; SATURDAY = 5; SUNDAY = 6;
}

message RepeatDays {
  repeated WeekDay days = 1;
}

message Alarm {
  // For fact matcher.
  // string tag = 1;
  TimeOfADay triggerAt = 2;
  RepeatDays repeat = 3;

  string note = 99;
  string id = 100;
}

message RandomInPeriod {
  TimeOfADay start = 1;
  TimeOfADay end = 2;

  RepeatDays repeat = 3;

  string note = 99;
  string id = 100;
}

message FixedInPeriod {
  TimeOfADay start = 1;
  TimeOfADay end = 2;

  RepeatDays repeat = 3;
  google.protobuf.Any fixedBy = 4;

  string note = 99;
  string id = 100;
}

message FixedByTimes {
  int32 times = 1;
}

message FixedByInterval {
  int64 interval = 1;
}

message AppBecomeFg {
  repeated AppPkg apps = 1;
  repeated string pkgSets = 2;

  string note = 99;
  string id = 100;
}

message AppBecomeBg {
  repeated AppPkg apps = 1;
  repeated string pkgSets = 2;

  string note = 99;
  string id = 100;
}

message BTStatusChanged {
  OnOffAny ooa = 1;

  string note = 99;
  string id = 100;
}

message BTConnectedTo {
  repeated string device = 1;

  string note = 99;
  string id = 100;
}

message BTDisconnectedFrom {
  repeated string device = 1;

  string note = 99;
  string id = 100;
}

message WifiStatusChanged {
  OnOffAny ooa = 1;

  string note = 99;
  string id = 100;
}

message WifiConnectedTo {
  repeated string ssidList = 1;

  string note = 99;
  string id = 100;
}

message WifiDisconnectedFrom {
  repeated string ssidList = 1;

  string note = 99;
  string id = 100;
}

message MobileDataStatusChanged {
  OnOffAny ooa = 1;

  string note = 99;
  string id = 100;
}

message NFCStatusChanged {
  OnOffAny ooa = 1;

  string note = 99;
  string id = 100;
}

message FlashLightStatusChanged {
  OnOffAny ooa = 1;

  string note = 99;
  string id = 100;
}

message LocationStatusChanged {
  OnOffAny ooa = 1;

  string note = 99;
  string id = 100;
}

message HotSpotStatusChanged {
  OnOffAny ooa = 1;

  string note = 99;
  string id = 100;
}

message DarkModeStatusChanged {
  OnOffAny ooa = 1;

  string note = 99;
  string id = 100;
}

message DNDStatusChanged {
  OnOffAny ooa = 1;

  string note = 99;
  string id = 100;
}

message ActivityStarted {
  repeated AppComponent components = 1;

  string note = 99;
  string id = 100;
}

message Notification {
  string title = 1;
  string contentText = 2;

  repeated AppPkg apps = 3;
  repeated string pkgSets = 4;

  string notificationId = 5;
  string notificationChannel = 6;
  bool isFgService = 7;
}

message NotificationPosted {
  Notification record = 1;

  string note = 99;
  string id = 100;
}

message NotificationRemoved {
  Notification record = 1;
  bool byUser = 2;

  string note = 99;
  string id = 100;
}

message NotificationUpdated {
  Notification old = 1;
  Notification new = 2;

  string note = 99;
  string id = 100;
}

message TaskRemoved {
  repeated AppPkg apps = 3;
  repeated string pkgSets = 4;

  string note = 99;
  string id = 100;
}

message SystemReady {
  string note = 99;
  string id = 100;
}

message AppAdded {
  string note = 99;
  string id = 100;
}

message AppRemoved {
  repeated AppPkg apps = 3;
  repeated string pkgSets = 4;

  string note = 99;
  string id = 100;
}

message AppUpdated {
  repeated AppPkg apps = 3;
  repeated string pkgSets = 4;

  string note = 99;
  string id = 100;
}

message PkgStopRunning {
  repeated AppPkg apps = 3;
  repeated string pkgSets = 4;

  string note = 99;
  string id = 100;
}

message AudioFocusGain {
  repeated AppPkg apps = 3;
  repeated string pkgSets = 4;

  string note = 99;
  string id = 100;
}

message AudioFocusLost {
  repeated AppPkg apps = 3;
  repeated string pkgSets = 4;

  string note = 99;
  string id = 100;
}

message AudioFocusChanged {
  string note = 99;
  string id = 100;
}

message Broadcast {
  repeated string actions = 1;
  string dataSchema = 2;

  string note = 99;
  string id = 100;
}

message VPNConnected {
  string note = 99;
  string id = 100;
}

message VPNDisconnected {
  string note = 99;
  string id = 100;
}

message MediaStoreInsert {
  string path = 1;
  string uriString = 2;

  string filterPath = 3;

  string note = 99;
  string id = 100;
}

message OnStartOp {
  repeated int32 opCodes = 1;

  repeated AppPkg apps = 2;
  repeated string pkgSets = 3;

  string note = 99;
  string id = 100;
}

message OnFinishOp {
  repeated int32 opCodes = 1;

  repeated AppPkg apps = 2;
  repeated string pkgSets = 3;

  string note = 99;
  string id = 100;
}